<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>塔罗占卜</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
       <div id="coverScreen" class="cover-screen">
      <div class="cover-stars"></div>
      <div class="cover-card">
        <div class="cover-moon"></div>
        <div class="cover-orb"></div>
        <p class="cover-kicker">问 · 卜 · 答</p>
        <h2 class="cover-title">塔罗占卜</h2>
        <p class="cover-tagline">
          你此刻最想问的问题，是什么？<br />
          牌面，已经等在那里了。
        </p>
        <button id="enterButton" type="button" class="cover-enter">开始占卜</button>
      </div>
    </div>

    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="kicker">Midnight Oracle</p>
          <h1>塔罗占卜</h1>
        </div>
        <div class="actions">
          <input
            id="apiKeyInput"
            type="password"
            autocomplete="off"
            placeholder="Gemini API Key"
            aria-label="Gemini API Key"
          />
          <select id="spreadSelect" aria-label="选择牌阵"></select>
          <button id="drawButton" type="button">抽牌</button>
        </div>
      </header>

      <section class="question-panel" aria-label="提问">
        <textarea
          id="questionInput"
          maxlength="180"
          placeholder="写下你想问的问题，例如：这段关系接下来我该怎么面对？"
        ></textarea>
        <div class="spread-note">
          <strong id="spreadTitle">牌阵</strong>
          <span id="spreadMeaning">选择一个牌阵后开始抽卡。</span>
        </div>
      </section>

      <section class="spread-panel" aria-label="牌阵">
        <div id="spreadTabs" class="spread-tabs" aria-label="快速选择牌阵"></div>
        <div id="cardStage" class="card-stage"></div>
        <div id="cardTooltip" class="card-tooltip" hidden></div>
      </section>

      <section class="ai-panel" aria-label="AI解读">
        <div class="panel-title">
          <span>AI 解读</span>
          <small id="aiSource">Gemini / 本地备用</small>
        </div>
        <div id="aiReading" class="ai-reading">
          抽卡后会结合你的问题给出一段完整解读。
        </div>
      </section>
    </main>

    <div id="gateModal" class="gate-modal" hidden>
      <div class="gate-card">
        <h3 id="gateTitle">提示</h3>
        <div id="gateBody"></div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
